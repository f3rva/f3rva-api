[build-system]
requires = ["setuptools>=68.0.0", "setuptools-scm>=8.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f3rva-api"
dynamic = ["version"]
description = "Modern Python REST and Serverless API service for F3 RVA backblasts, workouts, member analytics, and schedule."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "F3 RVA Team", email = "admin@f3rva.org" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "mangum>=0.19.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "pymysql>=1.1.1",
    "cryptography>=43.0.0",
    "pyjwt[crypto]>=2.9.0",
    "boto3>=1.35.0",
    "beautifulsoup4>=4.12.3",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "setuptools-scm>=8.0.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.28.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-boto3>=1.35.0",
    "types-pymysql>=1.1.0",
    "types-beautifulsoup4>=4.12.0",
]

[tool.setuptools_scm]
write_to = "src/_version.py"
fallback_version = "0.1.0"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "T20", "PT"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
warn_unused_configs = true
